Listen 0.0.0.0:8091

<VirtualHost *:8091>
    ServerName 31.97.106.123

    SSLEngine on
    SSLCertificateFile /etc/ssl/kurmigo-usahaup/ip-31.97.106.123.crt
    SSLCertificateKeyFile /etc/ssl/kurmigo-usahaup/ip-31.97.106.123.key

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8093/
    ProxyPassReverse / http://127.0.0.1:8093/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "8091"
    RequestHeader set X-Forwarded-Host "31.97.106.123:8091"

    ErrorLog ${APACHE_LOG_DIR}/hris-8091-error.log
    CustomLog ${APACHE_LOG_DIR}/hris-8091-access.log combined
</VirtualHost>
