Listen 0.0.0.0:8092

<VirtualHost *:8092>
    ServerName 31.97.106.123

    SSLEngine on
    SSLCertificateFile /etc/ssl/kurmigo-usahaup/ip-31.97.106.123.crt
    SSLCertificateKeyFile /etc/ssl/kurmigo-usahaup/ip-31.97.106.123.key

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8093/
    ProxyPassReverse / http://127.0.0.1:8093/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "8092"
    RequestHeader set X-Forwarded-Host "31.97.106.123:8092"

    ErrorLog ${APACHE_LOG_DIR}/hris-8092-error.log
    CustomLog ${APACHE_LOG_DIR}/hris-8092-access.log combined
</VirtualHost>
